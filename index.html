<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F7F4EB" />
  <meta name="description" content="Eure Projekte. Eure Zeit. Eure Erinnerungen. Interaktiver Prototyp." />
  <title>PAL ♡ | Patrick & Albert – Cloud 0.8</title>
  <style>
  body.pal-cloud-locked #app{visibility:hidden}
  #pal-gate[hidden],#pal-cloud-status[hidden]{display:none}
  #pal-gate{position:fixed;inset:0;z-index:99999;background:#f7f4eb;display:grid;place-items:center;padding:24px;color:#252e37;font-family:system-ui,sans-serif}
  .pal-auth-card{max-width:420px;width:100%;background:white;border-radius:22px;padding:30px;box-shadow:0 12px 50px #0001}
  .pal-auth-card h1{margin:0 0 12px}.pal-auth-card p{line-height:1.5}
  .pal-auth-card form{display:grid;gap:10px;margin:24px 0}
  .pal-auth-card input{padding:13px;border:1px solid #acb8b1;border-radius:10px;font-size:16px}
  .pal-auth-card button{background:#237b57;color:white;border:0;border-radius:10px;padding:13px;cursor:pointer;font-size:16px}
  .pal-auth-card button:disabled{opacity:.6}.pal-auth-error{color:#a31c30}.pal-auth-hint{font-size:12px;opacity:.7}
  #pal-cloud-status{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:5000;background:#225e50;color:white;padding:8px 15px;border-radius:20px;font:12px system-ui;box-shadow:0 4px 18px #0002;max-width:90vw;text-align:center}
  #pal-cloud-status[data-error="true"]{background:#932a34}
  </style>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="soft-redesign.css" />
  <link rel="stylesheet" href="app-colors.css" />
  <link rel="stylesheet" href="friendly-flat.css" />
  <link rel="stylesheet" href="v06-enhancements.css" />
  <link rel="stylesheet" href="v07-enhancements.css" />
</head>
<body class="pal-cloud-locked">
  <div id="pal-gate"><div data-gate-body></div></div>
  <div id="pal-cloud-status" hidden></div>
  <div id="app" class="app-shell friendly-ui tone-light">
    <div class="ambient" id="ambient"></div>
    <div id="view" class="view"></div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Hauptnavigation"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="crop-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="pal-sync.js"></script>
</body>
</html>
